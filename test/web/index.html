<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webecons Terminal Ad</title>
    <style>
        body {
            background: #0f172a;
            display: flex;
            flex-direction: column;
            /* Stacks items vertically */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            /* Modern, clean font */
            padding: 20px;
        }

        /* --- New Marketing Text Styles --- */
        .hero-section {
            text-align: center;
            margin-bottom: 50px;
            /* Space between text and terminal */
        }

        .hero-title {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .hero-subtitle {
            color: #94a3b8;
            font-size: 1.5rem;
            font-weight: 500;
            margin: 15px 0 0 0;
        }

        .gradient-text {
            background: linear-gradient(to right, #00f2fe, #4facfe);
            /* Cyan/Blue gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Existing Terminal Styles --- */
        .terminal-window {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 254, 0.1);
            width: 100%;
            max-width: 550px;
            /* Made slightly wider to fit perfectly under the text */
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .terminal-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .dot.red {
            background-color: #ff5f56;
        }

        .dot.yellow {
            background-color: #ffbd2e;
        }

        .dot.green {
            background-color: #27c93f;
        }

        .terminal-title {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-left: auto;
            margin-right: auto;
            padding-right: 50px;
        }

        .terminal-body {
            padding: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            min-height: 25px;
        }

        .prompt {
            color: #27c93f;
            margin-right: 10px;
            font-weight: bold;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.3rem;
            background-color: #e2e8f0;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="hero-section">
        <h1 class="hero-title"><span class="gradient-text">1000+</span> Icons</h1>
        <h1 class="hero-title">in more than <span class="gradient-text">14+</span> SDKs</h1>
        <p class="hero-subtitle">The ultimate asset library for developers.</p>
    </div>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <div class="terminal-title">bash - install</div>
        </div>
        <div class="terminal-body">
            <span class="prompt">~$</span>
            <span id="typewriter"></span><span class="cursor"></span>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const textToType = "pip install webecon";
            const typeWriterElement = document.getElementById("typewriter");

            let i = 0;
            let isDeleting = false;

            function typeWriter() {
                let currentSubString = textToType.substring(0, i);

                if (currentSubString.startsWith("pip")) {
                    currentSubString = currentSubString.replace("pip", '<span style="color: #e5c07b;">pip</span>');
                }

                if (!isDeleting && i <= textToType.length) {
                    typeWriterElement.innerHTML = currentSubString;
                    i++;
                    setTimeout(typeWriter, 100);
                } else if (isDeleting && i >= 0) {
                    typeWriterElement.innerHTML = currentSubString;
                    i--;
                    setTimeout(typeWriter, 50);
                } else {
                    isDeleting = !isDeleting;
                    const pauseTime = isDeleting ? 2000 : 500;
                    setTimeout(typeWriter, pauseTime);
                }
            }

            setTimeout(typeWriter, 800);
        });
    </script>

</body>

</html>
